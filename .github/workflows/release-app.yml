name: Release slim app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-tauri-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $packageVersion"
          }
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Release notes are missing: $notes"
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed slim installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Repository secret TAURI_SIGNING_PRIVATE_KEY is not configured"
          }
          ./scripts/package_windows.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $notes = "docs/releases/$tag.md"
          $installer = "release-artifacts/VoxNote_${version}_x64-slim-setup.exe"
          $assets = @($installer, "$installer.sig", "release-artifacts/latest.json")
          gh release create $tag @assets --title "VoxNote $version" --notes-file $notes --latest
