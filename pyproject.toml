[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxnote"
version = "0.2.0"
description = "Local Russian audio transcription for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "VoxNote contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "av>=12",
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
gpu = [
  "nvidia-cublas-cu12==12.9.2.10; platform_system == 'Windows'",
  "nvidia-cudnn-cu12==9.28.1.4; platform_system == 'Windows'",
]
dev = [
  "mypy>=1.13",
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
voxnote = "voxnote.sidecar.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxnote = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".venv",
  "build",
  "dist",
  "src-tauri",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

