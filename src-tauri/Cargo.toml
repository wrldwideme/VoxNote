[package]
name = "voxnote"
version = "0.1.2"
description = "VoxNote Desktop - Local Russian Audio Transcription"
authors = ["VoxNote Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
